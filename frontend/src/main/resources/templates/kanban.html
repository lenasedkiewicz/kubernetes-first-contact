<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board</title>
    <link rel="stylesheet" th:href="@{/css/kanban.css}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Task Board</h1>
            <button class="btn btn-primary" onclick="openModal()">+ Add New Task</button>
        </header>

        <!-- Flash Messages -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="kanban-board">
            <!-- TO DO Column -->
            <div class="kanban-column">
                <div class="column-header todo-header">
                    <h2>TO DO</h2>
                    <span class="task-count" th:text="${#lists.size(todoTasks)}">0</span>
                </div>
                <div class="column-content">
                    <div th:each="task : ${todoTasks}" th:replace="~{fragments/task-card :: task-card(${task})}"></div>
                    <div th:if="${#lists.isEmpty(todoTasks)}" class="empty-column">No tasks</div>
                </div>
            </div>

            <!-- IN PROGRESS Column -->
            <div class="kanban-column">
                <div class="column-header inprogress-header">
                    <h2>IN PROGRESS</h2>
                    <span class="task-count" th:text="${#lists.size(inProgressTasks)}">0</span>
                </div>
                <div class="column-content">
                    <div th:each="task : ${inProgressTasks}" th:replace="~{fragments/task-card :: task-card(${task})}"></div>
                    <div th:if="${#lists.isEmpty(inProgressTasks)}" class="empty-column">No tasks</div>
                </div>
            </div>

            <!-- DONE Column -->
            <div class="kanban-column">
                <div class="column-header done-header">
                    <h2>DONE</h2>
                    <span class="task-count" th:text="${#lists.size(doneTasks)}">0</span>
                </div>
                <div class="column-content">
                    <div th:each="task : ${doneTasks}" th:replace="~{fragments/task-card :: task-card(${task})}"></div>
                    <div th:if="${#lists.isEmpty(doneTasks)}" class="empty-column">No tasks</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Create/Edit Task -->
    <div id="taskModal" class="modal" th:classappend="${isEdit} ? 'show' : ''">
        <div class="modal-content">
            <div class="modal-header">
                <h2 th:text="${isEdit} ? 'Edit Task' : 'Create New Task'">Create New Task</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form th:action="${isEdit} ? @{/tasks/{id}(id=${taskForm.id})} : @{/tasks}" method="post">
                <div class="form-group">
                    <label for="name">Task Name</label>
                    <input type="text" id="name" name="name" th:value="${taskForm.name}" required maxlength="255" placeholder="Enter task name">
                </div>
                <div class="form-group">
                    <label for="durationMinutes">Duration (minutes)</label>
                    <input type="number" id="durationMinutes" name="durationMinutes" th:value="${taskForm.durationMinutes}" required min="1" placeholder="Enter duration">
                </div>
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority" required>
                        <option value="">Select priority</option>
                        <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}" th:selected="${taskForm.priority == p}"></option>
                    </select>
                </div>
                <div th:if="${isEdit}" class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" required>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.name().replace('_', ' ')}" th:selected="${taskForm.status == s}"></option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Update Task' : 'Create Task'">Create Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('taskModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('show');
            window.location.href = '/';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            var modal = document.getElementById('taskModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
