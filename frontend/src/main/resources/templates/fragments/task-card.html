<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="task-card(task)" class="task-card">
    <div class="task-header">
        <span class="task-name" th:text="${task.name}">Task Name</span>
        <span class="priority-badge"
              th:classappend="${task.priority.name() == 'HIGH' ? 'priority-high' : (task.priority.name() == 'MEDIUM' ? 'priority-medium' : 'priority-low')}"
              th:text="${task.priority}">HIGH</span>
    </div>
    <div class="task-duration">
        <span th:text="${task.durationMinutes + ' min'}">30 min</span>
    </div>
    <div class="task-actions">
        <div class="move-buttons">
            <form th:if="${task.status.name() != 'TO_DO'}" th:action="@{/tasks/{id}/move-left(id=${task.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-move" title="Move Left">&larr;</button>
            </form>
            <form th:if="${task.status.name() != 'DONE'}" th:action="@{/tasks/{id}/move-right(id=${task.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-move" title="Move Right">&rarr;</button>
            </form>
        </div>
        <div class="crud-buttons">
            <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-edit">Edit</a>
            <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" style="display:inline;"
                  onsubmit="return confirm('Are you sure you want to delete this task?');">
                <button type="submit" class="btn btn-delete">Delete</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
