services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - app-network

  tasks-service:
    build:
      context: ./tasks-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - tasks-data:/data
    depends_on:
      - kafka
    networks:
      - app-network

  taskboard-api:
    build:
      context: ./taskboard-api
      dockerfile: Dockerfile
    ports:
      - "5100:5100"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - TASKS_SERVICE_URL=http://tasks-service:8082
    depends_on:
      - kafka
      - tasks-service
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - TASKBOARD_API_BASE_URL=http://taskboard-api:5100
    depends_on:
      - taskboard-api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  tasks-data:
