apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-service
  labels:
    app: tasks-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tasks-service
  template:
    metadata:
      labels:
        app: tasks-service
    spec:
      containers:
      - name: tasks-service
        image: tasks-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8082
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        volumeMounts:
        - name: tasks-data
          mountPath: /data
      volumes:
      - name: tasks-data
        persistentVolumeClaim:
          claimName: tasks-service-pvc
